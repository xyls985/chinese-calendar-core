name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: All language tests
        run: python scripts/test_all.py
      - name: Build Python distribution
        run: python -m pip wheel ./python --no-deps --wheel-dir .build/wheels
      - name: Build Java package
        run: mvn -B -f java/pom.xml package
      - name: Build C++ with CMake
        run: |
          cmake -S cpp -B .build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build .build/cmake
          ctest --test-dir .build/cmake --output-on-failure
